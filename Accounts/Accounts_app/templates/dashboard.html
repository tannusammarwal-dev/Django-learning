{% extends "base.html" %}

{% block content %}

<section id="products" class="bg-white py-16">



    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <div class="mb-10 flex items-end justify-between">

            <div>
                <span class="font-semibold text-pink-600">
                    Our Collection
                </span>

                <h2 class="mt-2 text-3xl font-bold text-gray-900">
                    Trending Products
                </h2>
            </div>

            <!-- Product List Page -->
            <a href="{% url 'product_list' %}"
               class="font-semibold text-pink-600 hover:text-pink-700">
                View All →
            </a>

        </div>


        <!-- Dynamic Products -->

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">

            {% for product in products %}

            <article class="overflow-hidden rounded-2xl bg-pink-50 shadow-sm
                            transition-all duration-300
                            hover:-translate-y-2 hover:shadow-xl">

                <div class="relative">

                    <img
                        src="{{ product.image.url }}"
                        alt="{{ product.name }}"
                        class="h-72 w-full object-cover"
                    >

                </div>

                <div class="p-5">

                    <p class="text-sm text-pink-600">
                        {{ product.category }}
                    </p>

                    <h3 class="mt-1 text-lg font-bold text-gray-900">
                        {{ product.name }}
                    </h3>

                    <div class="mt-3">

                        <span class="text-xl font-bold text-pink-600">
                            ₹{{ product.price }}
                        </span>

                    </div>

                    <div class="mt-5 flex gap-2">

                        <!-- Detail Page -->
                        <a href="{% url 'product_detail' product.pk %}"
                           class="w-full rounded-lg border border-pink-500
                                  px-4 py-3 text-center font-semibold
                                  text-pink-500 hover:bg-pink-50">
                            View
                        </a>

                        <!-- Add To Cart -->
                        <a href="{% url 'add_to_cart' product.pk %}"
                           class="w-full rounded-lg bg-pink-500
                                  px-4 py-3 text-center font-semibold
                                  text-white hover:bg-pink-700">
                            Add to Cart
                        </a>

                    </div>

                </div>

            </article>

            {% empty %}

                <p class="col-span-full text-center text-gray-500">
                    No products available.
                </p>

            {% endfor %}

        </div>

    </div>

</section>
{% endblock %}
