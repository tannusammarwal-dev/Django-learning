{% extends "base.html" %} {% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8 sm:p-10">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-900">Welcome Back</h2>
        <p class="mt-2 text-sm text-gray-500">
          Login to your account to continue
        </p>
      </div>

      <!-- Login Form -->
      <form action="{% url 'login' %}" method="POST" class="space-y-6">
        {% csrf_token %}

        <!-- Username -->
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            Username
          </label>

          <input
            id="username"
            type="text"
            name="username"
            placeholder="Enter your username"
            required
            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 placeholder-gray-400 outline-none transition focus:border-pink-500 focus:ring-2 focus:ring-pink-200"
          />
        </div>

        <!-- Password -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter your password"
            required
            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 placeholder-gray-400 outline-none transition focus:border-pink-500 focus:ring-2 focus:ring-pink-200"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full rounded-lg bg-pink-500 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-pink-700 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2 active:bg-pink-800"
        >
          Login
        </button>
      </form>

      <!-- Footer -->
      <p class="mt-6 text-center text-sm text-gray-500">
        Don't have an account?
        <a
          href="#"
          class="font-medium text-pink-500 hover:text-pink-700"
        >
          Sign up
        </a>
      </p>

    </div>
  </div>
</div>

{% endblock %}
