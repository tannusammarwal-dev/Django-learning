{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-pink-50 px-5 py-12">

    <div class="mx-auto max-w-2xl">

        <div class="grid overflow-hidden rounded-3xl bg-white shadow-xl ">

            <!-- Product Image -->
            <div class="h-full min-h-[450px] bg-pink-100">
                <img
                    src="{{ product.image.url }}"
                    alt="{{ product.name }}"
                    class="h-full w-full object-cover"
                >
            </div>

            <!-- Product Information -->
            <div class="flex flex-col justify-center p-8 md:p-12">

                <h1 class="text-4xl font-extrabold text-gray-800">
                    {{ product.name }}
                </h1>

                <p class="mt-5 text-3xl font-bold text-pink-600">
                    ₹{{ product.price }}
                </p>

                <p class="mt-6 text-base leading-7 text-gray-600">
                    {{ product.description }}
                </p>

                <p class="mt-5 text-sm text-pink-400">
                    Added on {{ product.created_at|date:"d M Y" }}
                </p>

                <!-- Add to Cart -->
                <a
                    href=""
                    class="mt-8 rounded-xl bg-pink-600 px-6 py-4 text-center font-bold text-white shadow-lg shadow-pink-200 hover:bg-pink-700"
                >
                    Add to Cart
                </a>

                <!-- Back -->
                <a
                    href="{% url 'product_list' %}"
                    class="mt-4 text-center font-semibold text-pink-600 hover:text-pink-800"
                >
                    ← Back to Products
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
